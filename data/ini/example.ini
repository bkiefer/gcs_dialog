[Settings]
#minNoArgs=3
#maxNoArgs=4
#noAtoms=100000
#noTuples=500000
#PersistencyFile=persistent.nt
Encoding=UTF-8

# further options for the future,
# e.g., character encoding, persistent output file name, etc.

[Namespaces]
# namespaces for XSD, RDF, RDFS, and OWL are already defined
dial = http://www.dfki.de/lt/onto/common/dialogue.owl#
rli = http://www.dfki.de/lt/onto/intuitiv/rolli#
ind = http://www.dfki.de/lt/onto/intuitiv/indoor#
nav = http://www.dfki.de/lt/onto/intuitiv/indoor_navigation#
int = http://www.dfki.de/lt/onto/intuitiv/intuitiv#
dom = http://www.dfki.de/lt/onto/intuitiv/domain.owl#
osm = http://www.dfki.de/lt/onto/intuitiv/osm#
osmdatadfki = http://www.dfki.de/lt/onto/intuitiv/osmdatadfki#
osmdata = http://www.dfki.de/lt/onto/intuitiv/osmdata#

# instead, you can also load one or more namespace files
#default.ns

[Tuples]
# the axiomatic triples for OWL-Horst w/ EQ reduction
../ontology/default/default.eqred.nt

[Tuples]
# the PAL sub-ontologies
../ontology/dialogue/dialogue.nt

# Intuitiv sub-ontologies
../ontology/domain/domain.nt
../ontology/indoor_navigation/indoor_navigation.nt
../ontology/indoor/indoor.nt
../ontology/osm/osm.nt
# Tying everything together
../ontology/Intuitiv.nt
../ontology/poi.nt

# The map(s)
../ontology/osmdatadfki/osmdatadfki.nt
# Other instance data
../ontology/init/rolli.nt

[Rules]
# we need special rules for transaction time (mixture of triples/quadruples)
default.eqred.quads.rdl
