inputFile:          src/main/rudi/DialogAgent.rudi
outputDirectory:    src/main/gen-java
agentBase:          de.dfki.vondabase.BaseAgent
typeDef:            BaseAgent.rudi
ontologyFile:       src/main/resources/ini/example.yml
checkTypes:         true
failOnError:        false
verbose:            false
rootPackage:        de.dfki.vondabase

nameToURI:
  Agent : <dom:Actor>
  Robot : <dom:Robot>

defaultCompileCommand: compile
customCompileCommands:
  Compile without maven: vondac -c config.yml
  vcompile: vondac -v -c config.yml
debugPort : 9999
TTS:
  voice: dfki-pavoque-neutral-hsmm
  backup: false
NLG:
  de:
    mapperProject: src/main/resources/grammars/cplanner/allrules-mapper
    generationProject: src/main/resources/grammars/cplanner/allrules
NLU:
  de_DE:
    class: de.dfki.mlt.rudimant.agent.nlp.CombinedInterpreter
    instances:
    - class: de.dfki.mlt.rudimant.agent.nlp.SrgsParser
      grammar: src/main/resources/grammars/srgs/rolli.gram
      converter: src/main/resources/grammars/cplanner/srgsconv
      tokenizer:
        class: de.dfki.mlt.rudimant.agent.nlp.TrivialTokenizer
        toLower: false
        removePunctuation: true
    - class: de.dfki.vondabase.nlu.StanfordNER
      annotators: "tokenize,ssplit,pos,lemma,ner"