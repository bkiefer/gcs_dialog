# Docker compose file used to load the broker, ASR, and dialogue_manager
# TTS still to do
version: "3"

networks:
  mlt:
    driver: bridge

services:
  broker:
    image: 'eclipse-mosquitto:2.0.15'
    networks:
      - mlt
    restart: always
    container_name: 'mqtt-broker'
    hostname: 'mqtt-broker'
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  asr:
    image: 'alphacep/kaldi-de:latest'
    container_name: 'gcs_kaldi_asr'
    networks:
      - mlt
    ports:
      - '2700:2700'

  # Currently, this is using gstreamer and must be run on the machine itself
  # asr_micro:
  #   image: 'vosk_asr'
  #   container_name: 'gcs_asr_micro'
  #   networks:
  #     - mlt
  #   volumes:
  #     - ./respeaker_config.yaml:/app/user_config.yaml:ro

  dialog_manager:
    depends_on:
      - broker
#      - asr
    build:
      context: .
    image:  drz/gcs_dialog_manager:latest
    networks:
      - mlt
    container_name:  gcs_dialog_manager
    # environment:
    #   - DISPLAY=${DISPLAY}
    #   - ROS_MASTER_URI=${ROS_MASTER_URI}
    #   - ROS_IP=${ROS_IP}
    #   - DIA_IP=${DIA_IP}
    volumes:
      - ./config.yml:/config.yml
    #privileged: true
    #network_mode: host
    restart: ${RESTART_POLICY}
    stdin_open: true # docker run -i
    tty: true        # docker run -t
